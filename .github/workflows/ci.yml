name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # vitest 5 requires Node ^22.12.0
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client & Validate Schema
        env:
          # schema.prisma reads env("DATABASE_URL") directly; validate never connects.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: |
          npx prisma generate
          npx prisma validate

      - name: Type Check
        run: npx tsc --noEmit

      - name: Run Unit Tests
        run: npm test
